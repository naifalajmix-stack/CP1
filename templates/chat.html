<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة الذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338; /* خلفية ديسكورد الرمادية */
            color: #dbdee1;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #2b2d31; /* صندوق الشات الداكن */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        h2 {
            color: #ffffff;
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 15px;
        }
        .chat-box {
            flex: 1;
            background-color: #1e1f22;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #3f4147;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #383a40;
            border: 1px solid #1e1f22;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #5865F2;
        }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #4752C4; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #00aff4;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 AI Chat </h2>
    
    <div class="chat-box" id="chatBox">
        <div style="color: #949ba4; text-align: center; margin-top: 20px;">اسأل...</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <a href="/" class="back-link">العودة للرئيسية</a>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();
        if (!text) return;

        // إضافة رسالة المستخدم
        chatBox.innerHTML += `<div style="margin: 10px 0; text-align: left;"><b style="color: #5865F2;">أنت:</b> ${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // إرسال الطلب للسيرفر
        fetch('/get_ai_response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        })
        .then(res => res.json())
        .then(data => {
            chatBox.innerHTML += `<div style="margin: 10px 0; text-align: right;"><b style="color: #3ba55d;">الذكاء الاصطناعي:</b> ${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(err => {
            chatBox.innerHTML += `<div style="color: #ed4245; margin: 10px 0;">حدث خطأ في الاتصال.</div>`;
        });
    }
</script>

</body>
</html>
