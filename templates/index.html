<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - لوحة تحكم ديسكورد</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338; /* خلفية ديسكورد الرمادية الداكنة */
            color: #dbdee1;            /* لون النص الفاتح المتطابق مع ديسكورد */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #2b2d31;       /* صندوق الصفحة بلون ديسكورد الداكن */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 15px;
        }
        p {
            color: #949ba4;
            margin-bottom: 25px;
        }
        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .main-btn {
            background-color: #5865F2; /* لون كحلي/أزرق ديسكورد */
            color: #ffffff;            /* كتابة بيضاء */
            font-weight: bold;         /* خط عريض */
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: background 0.2s;
        }
        .main-btn:hover {
            background-color: #4752C4; /* درجة كحلي أغمق شوي عند مرور الماوس */
        }
    </style>
</head>
<body>  
 <style>
  .logo-container {
    position: absolute;
    top: 25px;
    right: 30px;
    text-align: center;
  }
  .server-logo {
    width: 95px; /* الحجم الجديد الأكبر للصورة */
    height: 95px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto;
  }
  .logo-text {
    color: #dbdee1; /* لون النص المتطابق مع ديسكورد */
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px; /* مسافة بسيطة بين الصورة والنص */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
</style>

<!-- اللوغو مع النص تحته في الزاوية العليا اليمنى -->
<div class="logo-container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Server Logo" class="server-logo">
    <div class="logo-text">Stay Here</div>
</div>
<div class="container">
    <h1>Control Panel</h1>
    <p>Advanced server management tools</p>
    
    <div class="buttons-group">
        <a href="/discord" class="main-btn">Members Management 🚀</a>
        <a href="/chat" class="main-btn">AI Chat 💬</a>
        <a href="/generator" class="main-btn">Python Generator ⚡</a>
    </div>
</div>

</body>
</html>
